<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 36px; width: 1200px;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    color: #1f2328; background: #ffffff;
  }
  .tag { display: inline-block; font-size: 15px; letter-spacing: 1px; color: #57606a; border: 1px solid #d0d7de; border-radius: 999px; padding: 4px 12px; }
  h1 { font-size: 31px; line-height: 1.35; margin: 16px 0 10px; }
  .meta { font-size: 16px; color: #57606a; margin-bottom: 16px; }
  .abstract { font-size: 19px; line-height: 1.7; color: #24292f; border-left: 6px solid #d0d7de; padding-left: 18px; }
  .reason { margin-top: 16px; font-size: 18px; line-height: 1.65; background: #f6f8fa; border-radius: 10px; padding: 12px 16px; }
  .foot { margin-top: 18px; font-size: 14px; color: #8b949e; word-break: break-all; }
</style>
</head>
<body>
  <span class="tag">{{ direction_name }}</span>
  <h1>{{ paper.title }}</h1>
  <div class="meta">{{ paper.authors | join(", ") }}{% if paper.authors | length == 3 %} et al.{% endif %} · {{ paper.source }} · {{ paper.published }}</div>
  <div class="abstract">{{ paper.abstract_snippet }}</div>
  {% if paper.reason %}<div class="reason">导读：{{ paper.reason }}</div>{% endif %}
  <div class="foot">{{ paper.url }}</div>
</body>
</html>
